name: Despliegue Automático

on:
  push:
    branches:
      - main # Cambia esto si tu rama principal tiene otro nombre

jobs:
  desplegar_en_servidor:
    runs-on: self-hosted

    steps:
      - name: Detener contenedores existentes
        run: docker compose down || true
    
      - name: Descargar el código más reciente al servidor
        uses: actions/checkout@v4

      - name: Traer copiar secretos locales a backend
        run: cp /DATA/Documents/secretos_proyecto/.env ./.env

      - name: Traer copiar secretos locales a frontend
        run: cp /DATA/Documents/secretos_proyecto/.env.production ./Frontend/.env.production

      - name: Construir imágenes y levantar el proyecto
        run: |
          docker compose up -d --build
